name: Playwright Profiling

on:
  workflow_dispatch:

jobs:
  profile:
    name: Run Automated Profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repeat profiling harness
        run: npm run perf:profile:repeat:ci

      - name: Check perf regression against baseline
        run: npm run perf:profile:check:ci

      - name: Upload profiling artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-profile-artifacts
          path: test-output/perf/repeat-latest
          if-no-files-found: error
