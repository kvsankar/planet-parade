name: Deploy to Hostgator via SFTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to sankara.net
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Build completed. Checking artifacts..."
          ls -la dist/
          test -f dist/index.html

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SFTP_PORT }} -H ${{ secrets.SFTP_HOST }} >> ~/.ssh/known_hosts

      - name: Debug SSH key format
        run: |
          echo "Key file info:"
          wc -l ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          echo "Key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key || echo "Failed to read key"

      - name: Test SSH connection
        run: |
          ssh -vvv -i ~/.ssh/deploy_key -p ${{ secrets.SFTP_PORT }} \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }} \
            "echo SSH_OK" 2>&1 | tail -80
        timeout-minutes: 2
        continue-on-error: true

      - name: Deploy to Hostgator via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10" \
            ./dist/ \
            ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_REMOTE_PATH }}
        timeout-minutes: 10

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment Summary
        run: |
          echo "Deployment completed successfully!"
          echo "Site URL: https://sankara.net/astro/skyalign/"
          echo "Deployed from: dist/"
          echo "Remote path: ${{ secrets.SFTP_REMOTE_PATH }}"
